name: Compiler and standard library CI

on:
  push:
    branches: [main, 'release-check/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: LLVM ${{ matrix.llvm }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - llvm: 20
            require_baseline: "ON"
          - llvm: 22
            require_baseline: "OFF"
    env:
      LLVM_MAJOR: ${{ matrix.llvm }}
      REQUIRE_BASELINE: ${{ matrix.require_baseline }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install toolchains
        run: |
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm-snapshot.gpg.key -o "$RUNNER_TEMP/llvm.gpg.asc"
          sudo install -m 0644 "$RUNNER_TEMP/llvm.gpg.asc" /usr/share/keyrings/llvm-snapshot.asc
          printf 'deb [signed-by=/usr/share/keyrings/llvm-snapshot.asc] https://apt.llvm.org/noble/ llvm-toolchain-noble-%s main\n' "$LLVM_MAJOR" \
            | sudo tee /etc/apt/sources.list.d/vaqrin-llvm.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "clang-$LLVM_MAJOR" "llvm-$LLVM_MAJOR-dev" \
            cmake ninja-build python3 gcc-arm-none-eabi openssl libssl-dev libnghttp2-dev zlib1g-dev
          printf '/usr/lib/llvm-%s/bin\n' "$LLVM_MAJOR" >> "$GITHUB_PATH"

      - name: Install protocol test dependencies
        run: |
          python3 -m pip install --target "$RUNNER_TEMP/vaqrin-python" "grpcio-tools>=1.62,<2" "h2>=4.1,<5"
          printf 'PYTHONPATH=%s\n' "$RUNNER_TEMP/vaqrin-python" >> "$GITHUB_ENV"

      - name: Configure and build
        run: |
          llvm-config --version
          cmake -S compiler -B build/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_DIR="$(llvm-config --cmakedir)" \
            -DVAQRIN_REQUIRE_BASELINE="$REQUIRE_BASELINE" \
            -DBUILD_TESTING=ON
          cmake --build build/ci --parallel 2
          build/ci/vaqc --version

      - name: Check native I/O runtime
        run: |
          clang++ -std=c++20 -Wall -Wextra -pedantic-errors \
            -fno-exceptions -fno-rtti -fsyntax-only \
            compiler/runtime/io_posix.cpp compiler/runtime/tls_openssl.cpp compiler/runtime/http2_nghttp2.cpp compiler/runtime/gzip_zlib.cpp

      - name: Run all acceptance suites
        run: ctest --test-dir build/ci --output-on-failure --no-tests=error --parallel 1

      - name: Verify Unicode 17.0 conformance
        run: |
          base=https://raw.githubusercontent.com/unicode-org/unicodetools/main/unicodetools/data/ucd/17.0.0
          mkdir -p "$RUNNER_TEMP/ucd17"
          curl --fail --silent --show-error --retry 3 "$base/NormalizationTest.txt" -o "$RUNNER_TEMP/ucd17/NormalizationTest.txt"
          curl --fail --silent --show-error --retry 3 "$base/auxiliary/GraphemeBreakTest.txt" -o "$RUNNER_TEMP/ucd17/GraphemeBreakTest.txt"
          python3 compiler/tests/unicode_conformance.py build/ci/vaqc "$RUNNER_TEMP/ucd17"

      - name: Checkout TOML 1.0 syntax fixtures
        uses: actions/checkout@v4
        with:
          repository: toml-lang/toml-test
          ref: 96fd088448ec0f4d9f061c730ed7854399c46faf
          path: build/toml-test
          persist-credentials: false

      - name: Verify TOML 1.0 syntax
        run: python3 compiler/tests/toml_conformance.py build/ci/vaqc build/toml-test/tests

      - name: Verify installed compiler and standard library
        run: |
          cmake --install build/ci --prefix "$RUNNER_TEMP/vaqrin"
          compiler="$RUNNER_TEMP/vaqrin/bin/vaqc"
          python3 compiler/tests/acceptance.py "$compiler" Acceptance.test_shipped_packages_load_together Acceptance.test_task_channel_single_worker Acceptance.test_spec_task_example
          python3 compiler/tests/io_acceptance.py "$compiler" IoAcceptance.test_task_and_io_runtimes_link_together
          python3 compiler/tests/stdlib_acceptance.py "$compiler" StandardLibraryAcceptance.test_https_client
          python3 compiler/tests/io_v2_acceptance.py "$compiler"
          python3 compiler/tests/protocol_acceptance.py "$compiler"
          python3 compiler/tools/release.py smoke "$RUNNER_TEMP/vaqrin"

      - name: Upload CTest diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-llvm-${{ matrix.llvm }}
          path: build/ci/Testing/Temporary/
          if-no-files-found: ignore

  io-native-quality:
    name: I/O sanitizers, fuzz and coverage
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run native quality checks
        run: compiler/tools/check_io_native.sh "$RUNNER_TEMP/vaqrin-io"
      - uses: actions/upload-artifact@v4
        with:
          name: native-io-coverage
          path: |
            ${{ runner.temp }}/vaqrin-io/gcov.log
            ${{ runner.temp }}/vaqrin-io/*.gcov

  zed-extension:
    name: Build Zed extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build WebAssembly extension
        run: |
          rustup target add wasm32-wasip1
          cargo build --locked --release --target wasm32-wasip1 --manifest-path editors/zed/Cargo.toml
