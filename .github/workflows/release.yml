name: Multi-platform build and release

on:
  push:
    branches: [main, 'release-check/**']
    tags: ['v*']
    paths:
      - 'compiler/**'
      - 'stdlib/**'
      - '.github/workflows/release.yml'
  pull_request:
    branches: [main]
    paths:
      - 'compiler/CMakeLists.txt'
      - 'compiler/tools/release.py'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, runner: ubuntu-24.04 }
          - { platform: linux-aarch64, runner: ubuntu-24.04-arm }
          - { platform: macos-x86_64, runner: macos-15-intel }
          - { platform: macos-aarch64, runner: macos-15 }
          - { platform: windows-x86_64, runner: windows-2025, msvc: amd64 }
          - { platform: windows-aarch64, runner: windows-11-arm, msvc: arm64 }
    env:
      LLVM_TAG: llvmorg-20.1.8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Select native Visual Studio tools
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VAQRIN_MSVC_ARCH: ${{ matrix.msvc }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -property installationPath
          if (-not $vs) { throw "Visual Studio is unavailable" }
          & "$vs\Common7\Tools\Launch-VsDevShell.ps1" -Arch $env:VAQRIN_MSVC_ARCH -HostArch $env:VAQRIN_MSVC_ARCH -SkipAutomaticLocation
          foreach ($key in @("PATH", "INCLUDE", "LIB", "LIBPATH", "VCToolsInstallDir", "WindowsSdkDir", "WindowsSDKVersion")) {
            $value = [Environment]::GetEnvironmentVariable($key)
            if ($value) { "$key=$value" >> $env:GITHUB_ENV }
          }

      - name: Ensure Ninja is available
        run: python -m pip install ninja

      - name: Restore LLVM SDK
        id: sdk
        uses: actions/cache/restore@v4
        with:
          path: build/llvm-sdk
          key: llvm-sdk-v3-${{ matrix.runner }}-${{ env.LLVM_TAG }}-x86-aarch64-arm

      - if: steps.sdk.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: llvm/llvm-project
          ref: ${{ env.LLVM_TAG }}
          path: build/llvm-project
          persist-credentials: false

      - name: Build LLVM SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        run: python compiler/tools/release.py llvm

      - name: Save the built LLVM SDK
        if: steps.sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/llvm-sdk
          key: ${{ steps.sdk.outputs.cache-primary-key }}

      - name: Build and smoke-test the installed compiler
        env:
          VAQRIN_RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python compiler/tools/release.py package

      - name: Verify POSIX processes and clocks from the installation
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: |
          python compiler/tests/stdlib_acceptance.py build/release-root/vaqrin/bin/vaqc \
            StandardLibraryAcceptance.test_process_status_and_output \
            StandardLibraryAcceptance.test_spawn_child_pipes_and_file_redirection \
            StandardLibraryAcceptance.test_native_clocks_and_absolute_deadline

      - name: Verify Linux runtime and protocol packages from the installation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang openssl libssl-dev libnghttp2-dev zlib1g-dev
          python -m pip install 'grpcio-tools>=1.62,<2' 'h2>=4.1,<5'
          compiler="$PWD/build/release-root/vaqrin/bin/vaqc"
          python compiler/tests/io_v2_acceptance.py "$compiler"
          python compiler/tests/protocol_acceptance.py "$compiler"

      - uses: actions/upload-artifact@v4
        with:
          name: vaqrin-${{ matrix.platform }}
          path: build/release-assets/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Publish all verified archives
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            printf '%s\n' 'Release tags must use vMAJOR.MINOR.PATCH with an optional prerelease suffix.'
            exit 1
          fi
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$(git rev-parse "$GITHUB_REF^{}")" origin/main
          cd assets
          sha256sum vaqrin-*.tar.gz vaqrin-*.zip > SHA256SUMS
          args=(--verify-tag --generate-notes)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            args+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" --json isDraft > release-state.json 2>/dev/null; then
            if [[ "$(jq -r '.isDraft' release-state.json)" != true ]]; then
              printf '%s\n' 'This tag already has a published release.'
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" "${args[@]}" --draft
          fi
          gh release upload "$GITHUB_REF_NAME" --clobber -- vaqrin-*.tar.gz vaqrin-*.zip SHA256SUMS
          gh release edit "$GITHUB_REF_NAME" --draft=false
