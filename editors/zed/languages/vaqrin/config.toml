name = "Vaqrin"
grammar = "vaqrin"
path_suffixes = ["vqr"]
line_comments = ["// "]
tab_size = 4
hard_tabs = false
word_characters = ["_"]
brackets = [
  { start = "{", end = "}", close = true, newline = true },
  { start = "[", end = "]", close = true, newline = true },
  { start = "(", end = ")", close = true, newline = true },
  { start = '"', end = '"', close = true, newline = false },
  { start = "'", end = "'", close = true, newline = false },
]
